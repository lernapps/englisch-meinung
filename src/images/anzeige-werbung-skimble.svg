<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
  <title>Erfundene Anzeige für die Marke Skimble</title>
  <rect width="640" height="420" fill="#f4efe2"/>
  <rect x="20" y="20" width="600" height="380" rx="14" fill="#2a9d8f" stroke="#333" stroke-width="3"/>
  <text x="44" y="80" text-anchor="start" font-family="sans-serif" font-size="46" font-weight="bold" fill="#fff" >Skimble</text>
  <text x="44" y="132" text-anchor="start" font-family="sans-serif" font-size="30" font-weight="bold" fill="#fff" >Are you ready to fly?</text>
  <text x="44" y="184" text-anchor="start" font-family="sans-serif" font-size="22" font-weight="bold" fill="#fff" >Faster than the rest.</text>
  <text x="44" y="214" text-anchor="start" font-family="sans-serif" font-size="22" font-weight="bold" fill="#fff" >Lighter than ever.</text>
  <text x="44" y="262" text-anchor="start" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffe66d" >Lace up. Jump in. Go!</text>
  <path d="M400 300 Q410 250 450 246 L500 246 Q520 280 580 284 Q600 290 596 312 L404 312 Z" fill="#fff" stroke="#222" stroke-width="3"/>
  <rect x="400" y="312" width="196" height="14" rx="6" fill="#ffe66d" stroke="#222" stroke-width="3"/>
  <text x="44" y="322" text-anchor="start" font-family="sans-serif" font-size="22" font-weight="bold" fill="#fff" >Skimble. Your feet fly.</text>
  <text x="44" y="356" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="normal" fill="#e6fffb" >Sizes 3 to 12. 40% recycled material.</text>
  <text x="44" y="382" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#d4f4ef" >Skimble: made-up brand for this lesson</text>
</svg>
