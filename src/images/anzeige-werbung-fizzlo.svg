<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img">
  <title>Erfundene Anzeige für die Marke Fizzlo, mit vier nummerierten Stellen</title>
  <rect width="640" height="470" fill="#f4efe2"/>
  <rect x="20" y="16" width="600" height="360" rx="14" fill="#ffe3b3" stroke="#333" stroke-width="3"/>
  <text x="44" y="74" text-anchor="start" font-family="sans-serif" font-size="46" font-weight="bold" fill="#c0392b" >Fizzlo</text>
  <circle cx="40" cy="100" r="15" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <text x="40" y="106" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222" >4</text>
  <text x="66" y="106" text-anchor="start" font-family="sans-serif" font-size="22" font-weight="bold" fill="#7a2c1d" >Pop into summer.</text>
  <rect x="470" y="110" width="70" height="170" rx="22" fill="#f08a24" stroke="#333" stroke-width="3"/>
  <rect x="488" y="92" width="34" height="26" rx="6" fill="#333"/>
  <circle cx="500" cy="150" r="8" fill="#ffe3b3"/><circle cx="520" cy="190" r="6" fill="#ffe3b3"/><circle cx="496" cy="230" r="7" fill="#ffe3b3"/>
  <circle cx="40" cy="160" r="15" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <text x="40" y="166" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222" >1</text>
  <text x="66" y="166" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222" >Who says juice has to be boring?</text>
  <circle cx="40" cy="214" r="15" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <text x="40" y="220" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222" >2</text>
  <text x="66" y="220" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222" >Fresh, fresh, fresh: new every day!</text>
  <circle cx="40" cy="268" r="15" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <text x="40" y="274" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222" >3</text>
  <text x="66" y="274" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222" >More fruit than any other juice.</text>
  <text x="44" y="350" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#7a5a3a" >Fizzlo: made-up brand for this lesson</text>
  <rect x="20" y="388" width="600" height="68" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="36" y="414" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222" >1  rhetorical question</text>
  <text x="330" y="414" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222" >2  repetition</text>
  <text x="36" y="442" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222" >3  comparison</text>
  <text x="330" y="442" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222" >4  slogan</text>
</svg>
